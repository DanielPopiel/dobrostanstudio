<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Projekty | dobrostanSTUDIO* | Portfolio Architektury Wnętrz</title>
    <meta name="description" content="Poznaj realizacje dobrostanSTUDIO. Świadome projektowanie wnętrz oparte na neuroarchitekturze.">
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;700;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & VARIABLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --color-bg: #F4F4F2; 
            --color-text-dark: #1A1A1A;
            --color-accent: #50344f; 
            --color-gold: #b9a646;
            --grid-color: rgba(0, 0, 0, 0.1); 
        }
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: var(--color-bg);
            color: var(--color-text-dark);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- LAYOUT --- */
        .left-column {
            width: 35%; height: 100vh; position: fixed; top: 0; left: 0;
            background-color: var(--color-bg);
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 132px 132px;
            display: flex; flex-direction: column; padding: 4rem 3rem; z-index: 100;
            border-right: 1px solid rgba(0,0,0,0.05);
        }
        .small-logo { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1.5rem; letter-spacing: -0.05em; color: var(--color-accent); text-decoration: none; }
        .small-logo span { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400; color: var(--color-gold); margin-right: 0.1em; }

        nav.vertical-menu { margin-top: 5rem; }
        nav.vertical-menu ul { list-style: none; display: flex; flex-direction: column; gap: 1.5rem; }
        nav.vertical-menu a { text-decoration: none; color: var(--color-text-dark); font-weight: 500; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.1em; transition: 0.3s; display: inline-block; }
        
        /* Poprawka: aktywny link i hover teraz odstawiają w prawo o 10px */
        nav.vertical-menu a:hover, nav.vertical-menu a.active { color: var(--color-accent); transform: translateX(10px); }

        /* --- CONTENT COLUMN --- */
        .right-column { width: 65%; margin-left: 35%; padding: 6rem 5% 10rem 5%; min-height: 100vh; position: relative; z-index: 5; }
        
        .portfolio-header { 
            margin-bottom: 5rem; 
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Wyrównanie do lewej dla całości sekcji */
        }
        .portfolio-header h1 { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 4.5vw; text-transform: uppercase; color: var(--color-accent); line-height: 1; }
        
        /* Poprawka: Napis wyrównany pod napisem PROJEKTY */
        .gallery-instruction {
            align-self: flex-start; 
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--color-text-dark);
            margin-top: 1rem;
            opacity: 0.7;
            font-weight: 500;
            border-bottom: 1px solid var(--color-gold);
            padding-bottom: 3px;
        }

        /* --- PROJECTS --- */
        .project-item { position: relative; margin-bottom: 8rem; cursor: pointer; display: flex; flex-direction: column; width: 100%; }
        .project-item.align-left { align-items: flex-start; }
        .project-item.align-right { align-items: flex-end; }
        
        .project-image-wrapper { width: 85%; position: relative; padding: 15px; border: 1px solid rgba(26, 26, 26, 0.15); transition: 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .project-item:hover .project-image-wrapper { border-color: var(--color-gold); transform: translateY(-5px); }
        .project-image { width: 100%; height: 500px; display: block; filter: grayscale(100%); transition: 0.8s; object-fit: cover; }
        .project-item:hover .project-image { filter: grayscale(0%); }

        .project-title { position: absolute; bottom: -5%; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 4.5vw; line-height: 0.8; color: var(--color-accent); z-index: 100; pointer-events: none; white-space: nowrap; text-transform: uppercase; }
        .project-item.align-left .project-title { left: -5%; }
        .project-item.align-right .project-title { right: -5%; text-align: right; }
        .project-title span.city-font { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400; font-size: 0.4em; color: var(--color-gold); display: block; margin-bottom: 5px; text-transform: lowercase; }

        /* --- MODAL --- */
        .gallery-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: var(--color-bg); z-index: 2000; display: none; overflow-y: auto; padding: 6rem 0; }
        .gallery-overlay.active { display: block; }
        .close-gallery { position: fixed; top: 2rem; right: 2rem; font-size: 0.7rem; cursor: pointer; border-bottom: 1px solid; z-index: 2100; text-transform: uppercase; background: var(--color-bg); padding: 5px; }
        .modal-image-wrapper { width: 80%; max-width: 900px; margin: 0 auto 4rem auto; padding: 15px; border: 1px solid rgba(26, 26, 26, 0.15); }
        .modal-image-wrapper img { width: 100%; display: block; }

        @media (max-width: 850px) {
            .left-column { width: 100%; height: auto; position: sticky; top: 0; padding: 1.5rem; align-items: center; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.05); background-size: 66px 66px; z-index: 1000; }
            nav.vertical-menu { margin-top: 1rem; width: 100%; }
            nav.vertical-menu ul { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 1rem; }
            nav.vertical-menu a:hover, nav.vertical-menu a.active { transform: none; } /* Usuwamy przesunięcie na mobile dla czytelności */
            .right-column { width: 100%; margin-left: 0; padding: 3rem 1.5rem; }
            .portfolio-header h1 { font-size: 14vw; }
            .gallery-instruction { align-self: flex-start; font-size: 0.55rem; }
            .project-image { height: 350px; filter: grayscale(0%); }
            .project-title { position: relative; font-size: 10vw; left: 0 !important; right: 0 !important; margin-top: 1rem; white-space: normal; }
            .project-image-wrapper { width: 100%; }
        }
    </style>
</head>
<body>

    <aside class="left-column">
        <a href="index.html" class="small-logo"><span>dobrostan</span>STUDIO*</a>
        <nav class="vertical-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projekty.html" class="active">Projekty</a></li>
                <li><a href="oferta.html">Oferta</a></li>
                <li><a href="omnie.html">O mnie</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </aside>

    <main class="right-column">
        <header class="portfolio-header">
            <h1>PROJEKTY*</h1>
            <span class="gallery-instruction">Eksploruj projekty / kliknij w obraz by otworzyć galerię</span>
        </header>

        <article class="project-item align-left" onclick="openGallery('BODEGA', 'Bodega')">
            <div class="project-image-wrapper">
                <img src="Projekty/BODEGA/main.webp" alt="Bodega" class="project-image" loading="lazy">
                <h2 class="project-title"><span class="city-font">restauracja</span>BODEGA</h2>
            </div>
        </article>

        <article class="project-item align-right" onclick="openGallery('BOHO', 'Boho')">
            <div class="project-image-wrapper">
                <img src="Projekty/BOHO/main.webp" alt="Boho" class="project-image" loading="lazy">
                <h2 class="project-title"><span class="city-font">siedlce</span>BOHO CHIC</h2>
            </div>
        </article>

        <article class="project-item align-left" onclick="openGallery('ESSENCE', 'Essence')">
            <div class="project-image-wrapper">
                <img src="Projekty/ESSENCE/main.webp" alt="Essence" class="project-image" loading="lazy">
                <h2 class="project-title"><span class="city-font">poznań</span>ESSENCE</h2>
            </div>
        </article>

        <article class="project-item align-right" onclick="openGallery('FORMA', 'Forma')">
            <div class="project-image-wrapper">
                <img src="Projekty/FORMA/main.webp" alt="Forma" class="project-image" loading="lazy">
                <h2 class="project-title"><span class="city-font">warszawa</span>FORMA</h2>
            </div>
        </article>

        <article class="project-item align-left" onclick="openGallery('NOWO', 'Nowo')">
            <div class="project-image-wrapper">
                <img src="Projekty/NOWO/main.webp" alt="Nowo" class="project-image" loading="lazy">
                <h2 class="project-title"><span class="city-font">warszawa</span>NOWO</h2>
            </div>
        </article>

        <article class="project-item align-right" onclick="openGallery('SENTIENT', 'Sentient')">
            <div class="project-image-wrapper">
                <img src="Projekty/SENTIENT/main.webp" alt="Sentient Siedlce" class="project-image" loading="lazy">
                <h2 class="project-title"><span class="city-font">siedlce</span>SENTIENT</h2>
            </div>
        </article>

        <article class="project-item align-left" onclick="openGallery('SKOSY', 'Skosy')">
            <div class="project-image-wrapper">
                <img src="Projekty/SKOSY/main.webp" alt="Skosy Warszawa" class="project-image" loading="lazy">
                <h2 class="project-title"><span class="city-font">warszawa</span>SKOSY</h2>
            </div>
        </article>
        
    </main>

    <div id="gallery-modal" class="gallery-overlay">
        <div class="close-gallery" onclick="closeGallery()">ZAMKNIJ (X)</div>
        <div class="gallery-content" id="gallery-images"></div>
    </div>

    <script>
        function openGallery(folder, desc) {
            const galleryImages = document.getElementById('gallery-images');
            galleryImages.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'modal-image-wrapper';
                const img = document.createElement('img');
                img.src = `Projekty/${folder}/${i}.webp`;
                img.alt = `${desc} - ${i}`;
                img.loading = "lazy";
                img.onerror = function() {
                    this.parentElement.style.display = 'none';
                };
                wrapper.appendChild(img);
                galleryImages.appendChild(wrapper);
            }
            document.getElementById('gallery-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeGallery() {
            document.getElementById('gallery-modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
